name: Naru
options:
  bundleIdPrefix: com.mickeyoh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

schemes:
  Naru:
    build:
      targets:
        Naru: all
    test:
      targets:
        - NaruUITests

targets:
  Naru:
    type: application
    platform: iOS
    sources:
      - Naru
    dependencies:
      - target: NaruShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mickeyoh.naru
        PRODUCT_NAME: Naru
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Naru
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Naru/Naru.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""

  NaruShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NaruShare
      - path: Naru/Sources/Models.swift
      - path: Naru/Sources/LinkMetadata.swift
      - path: Naru/Sources/FlowChips.swift
      - path: Naru/Sources/Typeface.swift
      - path: Naru/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mickeyoh.naru.share
        PRODUCT_NAME: NaruShare
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NaruShare/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: NaruShare/NaruShare.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""

  NaruUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NaruUITests
    dependencies:
      - target: Naru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mickeyoh.naru.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
